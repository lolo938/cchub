name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Create environment file
      run: |
        echo "APP_NAME=ChildcareHub CI" > .env
        echo "APP_VERSION=1.0.0" >> .env
        echo "ENVIRONMENT=development" >> .env
        echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
        echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env
        echo "FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" >> .env
        echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
        echo "FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}" >> .env
        echo "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> .env
        echo "FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}" >> .env
        echo "FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }}" >> .env
        echo "FIREBASE_IOS_APP_ID=${{ secrets.FIREBASE_IOS_APP_ID }}" >> .env
        echo "FIREBASE_IOS_BUNDLE_ID=com.childcarehub.childcarehubflutter" >> .env
        echo "ZEGO_APP_ID=${{ secrets.ZEGO_APP_ID }}" >> .env
        echo "ZEGO_APP_SIGN=${{ secrets.ZEGO_APP_SIGN }}" >> .env
        echo "API_BASE_URL=https://dev-api.childcarehub.com" >> .env
        echo "API_TIMEOUT=30000" >> .env
        echo "ENABLE_ANALYTICS=false" >> .env
        echo "ENABLE_CRASH_REPORTING=false" >> .env
        echo "ENABLE_PERFORMANCE_MONITORING=false" >> .env
        echo "ENABLE_DEBUG_LOGGING=true" >> .env
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .
      
    - name: Analyze project source
      run: flutter analyze
      
    - name: Run tests
      run: flutter test --coverage
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: coverage/lcov.info
        
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Create environment file
      run: |
        echo "APP_NAME=ChildcareHub" > .env.production
        echo "APP_VERSION=1.0.0" >> .env.production
        echo "ENVIRONMENT=production" >> .env.production
        echo "FIREBASE_API_KEY=${{ secrets.PROD_FIREBASE_API_KEY }}" >> .env.production
        echo "FIREBASE_APP_ID=${{ secrets.PROD_FIREBASE_APP_ID }}" >> .env.production
        echo "FIREBASE_MESSAGING_SENDER_ID=${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.production
        echo "FIREBASE_PROJECT_ID=${{ secrets.PROD_FIREBASE_PROJECT_ID }}" >> .env.production
        echo "FIREBASE_AUTH_DOMAIN=${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}" >> .env.production
        echo "FIREBASE_STORAGE_BUCKET=${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}" >> .env.production
        echo "FIREBASE_MEASUREMENT_ID=${{ secrets.PROD_FIREBASE_MEASUREMENT_ID }}" >> .env.production
        echo "FIREBASE_ANDROID_APP_ID=${{ secrets.PROD_FIREBASE_ANDROID_APP_ID }}" >> .env.production
        echo "FIREBASE_IOS_APP_ID=${{ secrets.PROD_FIREBASE_IOS_APP_ID }}" >> .env.production
        echo "FIREBASE_IOS_BUNDLE_ID=com.childcarehub.childcarehubflutter" >> .env.production
        echo "ZEGO_APP_ID=${{ secrets.PROD_ZEGO_APP_ID }}" >> .env.production
        echo "ZEGO_APP_SIGN=${{ secrets.PROD_ZEGO_APP_SIGN }}" >> .env.production
        echo "API_BASE_URL=https://api.childcarehub.com" >> .env.production
        echo "API_TIMEOUT=30000" >> .env.production
        echo "ENABLE_ANALYTICS=true" >> .env.production
        echo "ENABLE_CRASH_REPORTING=true" >> .env.production
        echo "ENABLE_PERFORMANCE_MONITORING=true" >> .env.production
        echo "ENABLE_DEBUG_LOGGING=false" >> .env.production
        
    - name: Create Google Services file
      run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      
    - name: Create signing key
      run: |
        echo '${{ secrets.ANDROID_KEYSTORE }}' | base64 --decode > android/app/upload-keystore.jks
        echo "MYAPP_RELEASE_STORE_FILE=upload-keystore.jks" > android/key.properties
        echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
        echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}" >> android/key.properties
        echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release --dart-define-from-file=.env.production
      
    - name: Build App Bundle
      run: flutter build appbundle --release --dart-define-from-file=.env.production
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
    - name: Upload App Bundle artifact
      uses: actions/upload-artifact@v3
      with:
        name: release-aab
        path: build/app/outputs/bundle/release/app-release.aab
        
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Create environment file
      run: |
        echo "APP_NAME=ChildcareHub" > .env.production
        echo "APP_VERSION=1.0.0" >> .env.production
        echo "ENVIRONMENT=production" >> .env.production
        echo "FIREBASE_API_KEY=${{ secrets.PROD_FIREBASE_API_KEY }}" >> .env.production
        echo "FIREBASE_APP_ID=${{ secrets.PROD_FIREBASE_APP_ID }}" >> .env.production
        echo "FIREBASE_MESSAGING_SENDER_ID=${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.production
        echo "FIREBASE_PROJECT_ID=${{ secrets.PROD_FIREBASE_PROJECT_ID }}" >> .env.production
        echo "FIREBASE_AUTH_DOMAIN=${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}" >> .env.production
        echo "FIREBASE_STORAGE_BUCKET=${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}" >> .env.production
        echo "FIREBASE_MEASUREMENT_ID=${{ secrets.PROD_FIREBASE_MEASUREMENT_ID }}" >> .env.production
        echo "FIREBASE_ANDROID_APP_ID=${{ secrets.PROD_FIREBASE_ANDROID_APP_ID }}" >> .env.production
        echo "FIREBASE_IOS_APP_ID=${{ secrets.PROD_FIREBASE_IOS_APP_ID }}" >> .env.production
        echo "FIREBASE_IOS_BUNDLE_ID=com.childcarehub.childcarehubflutter" >> .env.production
        echo "ZEGO_APP_ID=${{ secrets.PROD_ZEGO_APP_ID }}" >> .env.production
        echo "ZEGO_APP_SIGN=${{ secrets.PROD_ZEGO_APP_SIGN }}" >> .env.production
        echo "API_BASE_URL=https://api.childcarehub.com" >> .env.production
        echo "API_TIMEOUT=30000" >> .env.production
        echo "ENABLE_ANALYTICS=true" >> .env.production
        echo "ENABLE_CRASH_REPORTING=true" >> .env.production
        echo "ENABLE_PERFORMANCE_MONITORING=true" >> .env.production
        echo "ENABLE_DEBUG_LOGGING=false" >> .env.production
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build iOS (no signing)
      run: flutter build ios --release --no-codesign --dart-define-from-file=.env.production
      
    - name: Upload iOS build artifact
      uses: actions/upload-artifact@v3
      with:
        name: ios-build
        path: build/ios/iphoneos/Runner.app